version: '1.0'
name: pipeline-20260522
displayName: Cherry-Studio-Build-Pipeline
triggers:
  trigger: manual
stages:
  - name: stage-build-windows
    displayName: Windows 构建
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: build_windows
        displayName: Windows 安装包构建
        nodeVersion: 24.5.0
        commands:
          - '# 切换到项目目录'
          - cd $(git rev-parse --show-toplevel)
          - pwd
          - ''
          - '# 安装系统依赖（含 Wine 用于 Linux 交叉编译 Windows）'
          - dpkg --add-architecture i386
          - apt-get update
          - apt-get install -y python3 python3-pip wine64 wine32
          - ''
          - '# 安装全局工具'
          - npm install -g pnpm@10.27.0 dotenv-cli node-gyp
          - ''
          - '# 设置 NPM 源'
          - pnpm config set registry https://registry.npmmirror.com
          - ''
          - '# 安装依赖'
          - pnpm install --no-frozen-lockfile --ignore-scripts
          - ''
          - '# 编译原生模块'
          - cd node_modules/selection-hook && node-gyp rebuild || true
          - cd ../..
          - ''
          - '# 构建 Windows 安装包 (x64 + arm64)'
          - pnpm build:win
        artifacts:
          - name: WINDOWS_ARTIFACT
            path:
              - ./dist/*.exe
              - ./dist/*.zip
        caches:
          - ~/.pnpm-store
        notify: []
        strategy:
          retry: '0'
          resource:
            cpu: 2
            memory: 4
  # macOS 构建无法在 Linux 容器上交叉编译，需要 macOS runner
  # 如需构建 macOS，请在 GitHub Actions 等支持 macOS runner 的 CI 上执行
  # - name: stage-build-macos
  #   displayName: macOS 构建
  #   ...
